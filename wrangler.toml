name = "population-dashboard-prod"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["streams_enable_constructors"]

# Environment variables
vars = { ENVIRONMENT = "production" }

# KV Namespace bindings for caching (optional - requires Cloudflare account setup)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "population-cache"
# preview_id = "population-cache-preview"

# Analytics Engine (optional)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"

# Build configuration
[build]
command = "npm run build"
cwd = "./"
pages_build_output_dir = "public"

# Pages configuration
[pages]
project_name = "population-dashboard-pages"
